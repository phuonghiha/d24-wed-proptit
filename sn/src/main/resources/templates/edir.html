
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa thông tin bạn bè</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5fb;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h2 {
            color: #5965d8;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            background: #5965d8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        a {
            margin-left: 15px;
            color: #666;
        }
    </style>
</head>

<body>
<div class="container">

    <h2>✏️ Sửa thông tin bạn bè</h2>

    <form th:action="@{/friends/{id}/edit(id=${friend.id})}"
          method="post">

        <label>Tên bạn bè</label>

        <input
                type="text"
                name="name"
                th:value="${friend.name}"
                maxlength="100"
                required
        >

        <label>Ngày sinh</label>

        <input
                type="date"
                name="birthday"
                th:value="${friend.birthday}"
                required
        >

        <button type="submit">Lưu thay đổi</button>

        <a th:href="@{/}">Quay lại</a>

    </form>

</div>
</body>
</html>
